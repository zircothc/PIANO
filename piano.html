<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piano MIDI</title>
<style>
  :root { --bg:#1b1a19; --panel:#262422; --text:#ece6dc; --muted:#9a9186; --accent:#c9a86a; --white:#f3eee4; --black:#161514; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.5 Georgia, "Times New Roman", serif; display: flex; flex-direction: column; justify-content: center; padding: 24px; gap: 24px; }
  h1 { font-weight: normal; font-size: 2rem; margin: 0; letter-spacing: .02em; }
  .bar { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; background: var(--panel); padding: 14px 18px; border-radius: 8px; }
  button, select { font: inherit; color: var(--text); background: #34312e; border: 1px solid #4a4642; border-radius: 6px; padding: 8px 14px; }
  button { cursor: pointer; background: var(--accent); color: #1b1a19; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { color: var(--muted); }
  label { display: flex; gap: 8px; align-items: center; color: var(--muted); }
  #kb { position: relative; height: 200px; user-select: none; touch-action: none; overflow-x: auto; background: #0e0d0c; border-radius: 6px; padding: 0 0 0 0; }
  #kb .inner { position: relative; height: 100%; display: flex; min-width: 100%; }
  .w { flex: 1 0 28px; background: var(--white); border: 1px solid #8d857a; border-top: 0; border-radius: 0 0 4px 4px; }
  .w.on { background: var(--accent); }
  .b { position: absolute; top: 0; width: 18px; height: 62%; background: var(--black); border-radius: 0 0 3px 3px; z-index: 2; transform: translateX(-50%); }
  .b.on { background: #7a6232; }
</style>
</head>
<body>
  <h1>Piano MIDI</h1>
  <div class="bar">
    <label>Sonido <select id="sounds"><option>Buscando soundfonts…</option></select></label>
    <button id="load">Cargar sonido</button>
    <span id="status">Elige un sonido y pulsa «Cargar sonido».</span>
    <label>Teclado MIDI <select id="inputs"><option>Sin dispositivos</option></select></label>
    <label>Volumen <input id="vol" type="range" min="0" max="127" value="100"></label>
  </div>
  <div id="kb"><div class="inner" id="inner"></div></div>

<script type="module">
import { SplendidGrandPiano } from "https://cdn.jsdelivr.net/npm/smplr/+esm";
import { WorkletSynthesizer } from "https://cdn.jsdelivr.net/npm/spessasynth_lib@4/+esm";

const REPO = "zircothc/piano";           // usuario/repositorio
const WORKLET = "https://cdn.jsdelivr.net/npm/spessasynth_lib@4/dist/spessasynth_processor.min.js";

const $ = id => document.getElementById(id);
const status = $("status"), sel = $("inputs"), loadBtn = $("load"), soundSel = $("sounds");
let ctx, engine, midiAccess, currentInput = null, workletReady = false, master;
const held = new Set(), sustained = new Set();
let pedal = false;

// --- Lista de soundfonts del repo ---
async function listSoundfonts() {
  soundSel.innerHTML = '<option value="piano">Piano de cola (por defecto)</option>';
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/`);
    if (!r.ok) throw new Error(r.status);
    const files = (await r.json()).filter(f => f.type === "file" && /\.(sf2|sf3|dls)$/i.test(f.name));
    files.forEach(f => {
      const o = document.createElement("option");
      o.value = "sf:" + (f.download_url || f.name);
      o.dataset.local = f.name;
      o.textContent = f.name.replace(/\.(sf2|sf3|dls)$/i, "");
      soundSel.appendChild(o);
    });
    if (!files.length) status.textContent = "No hay soundfonts (.sf2/.sf3/.dls) en el repo. Solo está el piano por defecto.";
  } catch (e) {
    status.textContent = "No pude listar el repo (límite de GitHub o sin conexión). Solo está el piano por defecto.";
  }
}
listSoundfonts();

// --- Teclado en pantalla (C2–C7) ---
const FIRST = 36, LAST = 96, keyEls = {};
const isBlack = n => [1,3,6,8,10].includes(n % 12);
const inner = $("inner");
const whites = [];
for (let n = FIRST; n <= LAST; n++) if (!isBlack(n)) whites.push(n);
inner.style.minWidth = whites.length * 28 + "px";
whites.forEach(n => { const d = document.createElement("div"); d.className = "w"; d.dataset.n = n; inner.appendChild(d); keyEls[n] = d; });
whites.forEach((n, i) => {
  if (n + 1 <= LAST && isBlack(n + 1)) {
    const d = document.createElement("div"); d.className = "b"; d.dataset.n = n + 1;
    d.style.left = ((i + 1) / whites.length * 100) + "%";
    inner.appendChild(d); keyEls[n + 1] = d;
  }
});

// --- Motores de sonido (misma interfaz: on / off / stopAll / volume) ---
function smplrEngine(piano) {
  const stops = new Map();
  return {
    on: (n, v) => { stops.get(n)?.(); stops.set(n, piano.start({ note: n, velocity: Math.max(1, v) })); },
    off: n => { stops.get(n)?.(); stops.delete(n); },
    stopAll: () => { piano.stop(); stops.clear(); },
    volume: v => piano.output.setVolume(v),
    dispose: () => piano.stop()
  };
}
function spessaEngine(synth) {
  return {
    on: (n, v) => synth.noteOn(0, n, Math.max(1, v)),
    off: n => synth.noteOff(0, n),
    stopAll: () => synth.stopAll?.(true),
    volume: v => { master.gain.value = v / 100; },
    dispose: () => { try { synth.disconnect(); } catch {} }
  };
}

function noteOn(note, vel) {
  if (!engine) return;
  sustained.delete(note); held.add(note);
  engine.on(note, vel);
  keyEls[note]?.classList.add("on");
}
function noteOff(note) {
  held.delete(note);
  keyEls[note]?.classList.remove("on");
  if (pedal) sustained.add(note); else engine?.off(note);
}
function setPedal(down) {
  pedal = down;
  if (!down) { sustained.forEach(n => engine?.off(n)); sustained.clear(); }
}
function panic() {
  held.clear(); sustained.clear(); engine?.stopAll();
  document.querySelectorAll(".on").forEach(k => k.classList.remove("on"));
}
$("vol").oninput = () => engine?.volume(+$("vol").value);

// --- MIDI ---
function onMidi(e) {
  const [s, a, b] = e.data, cmd = s & 0xf0;
  if (cmd === 0x90 && b > 0) noteOn(a, b);
  else if (cmd === 0x80 || (cmd === 0x90 && b === 0)) noteOff(a);
  else if (cmd === 0xb0 && a === 64) setPedal(b >= 64);
  else if (cmd === 0xb0 && a === 123) panic();
}
function refreshInputs() {
  const prev = sel.value;
  sel.innerHTML = "";
  const ins = [...midiAccess.inputs.values()];
  if (!ins.length) { sel.innerHTML = "<option value=''>Sin dispositivos</option>"; connect(null); return; }
  ins.forEach(i => { const o = document.createElement("option"); o.value = i.id; o.textContent = i.name; sel.appendChild(o); });
  if (ins.some(i => i.id === prev)) sel.value = prev;
  connect(midiAccess.inputs.get(sel.value));
}
function connect(input) {
  if (currentInput) currentInput.onmidimessage = null;
  currentInput = input;
  if (input) input.onmidimessage = onMidi;
}
sel.onchange = () => connect(midiAccess.inputs.get(sel.value));

async function initMidi() {
  if (!navigator.requestMIDIAccess) { status.textContent = "Este navegador no soporta Web MIDI. Usa Chrome."; return; }
  try {
    midiAccess = await navigator.requestMIDIAccess();
    midiAccess.onstatechange = refreshInputs;
    refreshInputs();
  } catch (err) {
    status.textContent = "Permiso MIDI denegado. Permítelo en el candado de la barra de direcciones.";
  }
}

// --- Ratón / táctil sobre el teclado en pantalla ---
const pointers = new Map();
inner.addEventListener("pointerdown", e => {
  const k = e.target.closest("[data-n]"); if (!k) return;
  const n = +k.dataset.n; pointers.set(e.pointerId, n); noteOn(n, 90);
});
const up = e => { const n = pointers.get(e.pointerId); if (n != null) { noteOff(n); pointers.delete(e.pointerId); } };
addEventListener("pointerup", up); addEventListener("pointercancel", up);

// --- Carga ---
loadBtn.onclick = async () => {
  loadBtn.disabled = soundSel.disabled = true;
  const choice = soundSel.value, opt = soundSel.selectedOptions[0];
  try {
    panic();
    if (!ctx) { ctx = new AudioContext({ latencyHint: "interactive" }); master = ctx.createGain(); master.connect(ctx.destination); }
    await ctx.resume();
    engine?.dispose(); engine = null;
    if (choice === "piano") {
      status.textContent = "Cargando piano…";
      const piano = new SplendidGrandPiano(ctx);
      await piano.load;
      engine = smplrEngine(piano);
    } else {
      if (!workletReady) {
        status.textContent = "Preparando sintetizador…";
        const code = await (await fetch(WORKLET)).text();
        await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([code], { type: "text/javascript" })));
        workletReady = true;
      }
      status.textContent = "Descargando " + opt.textContent + "…";
      // Primero la copia local (mismo dominio, más rápida); si falla, la de GitHub
      let r = await fetch("./" + encodeURIComponent(opt.dataset.local)).catch(() => null);
      if (!r || !r.ok) r = await fetch(choice.slice(3));
      const buf = await r.arrayBuffer();
      status.textContent = "Procesando soundfont…";
      const synth = new WorkletSynthesizer(ctx);
      synth.connect(master);
      await synth.isReady;
      await synth.soundBankManager.addSoundBank(buf, "main");
      synth.programChange(0, 0);
      engine = spessaEngine(synth);
    }
    engine.volume(+$("vol").value);
    status.textContent = "Listo: " + opt.textContent + ". Toca.";
    loadBtn.textContent = "Cargar sonido";
    if (!midiAccess) await initMidi();
  } catch (err) {
    console.error(err);
    status.textContent = "Error al cargar: " + (err.message || err);
  }
  loadBtn.disabled = soundSel.disabled = false;
};
</script>
</body>
</html>
